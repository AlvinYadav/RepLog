name: RepLog
options:
  bundleIdPrefix: com.alvin
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  RepLog:
    type: application
    platform: iOS
    sources:
      - RepLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alvin.replog
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: RepLog/RepLog.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: RepLog/Info.plist
      properties:
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: RepLog uses the microphone so you can log workouts and meals by voice.
        NSSpeechRecognitionUsageDescription: RepLog transcribes your voice on-device to create log entries.
        NSCameraUsageDescription: RepLog uses the camera to photograph meals for macro estimates.
        NSPhotoLibraryUsageDescription: RepLog lets you pick meal photos for macro estimates.
        NSHealthShareUsageDescription: RepLog reads your steps and active energy to enrich weekly progress reports.
